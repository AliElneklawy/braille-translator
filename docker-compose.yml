services:
  telegram-bot:
    build: .
    command: uv run src/telegram_bot.py
    volumes:
      - ...
    restart: unless-stopped
  web-app:
    build: .
    command: uvicorn src.webapp.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ...
    restart: unless-stopped

volumes:
  - vol: